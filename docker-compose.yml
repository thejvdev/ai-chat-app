services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d chatdb -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  auth:
    build: ./services/auth
    image: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    env_file:
      - ./services/auth/.env
    volumes:
      - ./services/auth:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  tor1: &tor_template
    image: alpine:latest
    restart: unless-stopped
    expose:
      - "9050"
      - "9051"
    command: >
      sh -c "apk add --no-cache tor netcat-openbsd && 
      exec tor --SocksPort 0.0.0.0:9050 
      --ControlPort 127.0.0.1:9051 
      --CookieAuthentication 0 
      --HashedControlPassword ''"
    healthcheck:
      test: ["CMD-SHELL", "printf 'AUTHENTICATE \"\"\r\nGETINFO status/circuit-established\r\nQUIT\r\n' | nc -w 2 127.0.0.1 9051 | grep -q '250-status/circuit-established=1'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  tor2:
    <<: *tor_template

  ip_rotator:
    image: alpine:latest
    restart: unless-stopped
    depends_on:
      tor1:
        condition: service_healthy
      tor2:
        condition: service_healthy
    command: >
      sh -c "apk add --no-cache netcat-openbsd && 
      while true; do
        for i in 1 2; do
          printf 'AUTHENTICATE \"\"\r\nSIGNAL NEWNYM\r\nQUIT\r\n' | nc -w 2 tor$$i 9051;
        done;
        echo \"[$(date)] IP rotation signals sent to all nodes.\";
        sleep 60;
      done"

  haproxy:
    image: haproxy:alpine
    restart: unless-stopped
    depends_on:
      tor1:
        condition: service_healthy
      tor2:
        condition: service_healthy
    expose:
      - "9050"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  searxng:
    image: searxng/searxng
    restart: unless-stopped
    depends_on:
      haproxy:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
    volumes:
      - searxng_data:/var/cache/searxng/
      - ./searxng/settings.yml:/etc/searxng/settings.yml

  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:0.0.79
    restart: unless-stopped
    expose:
      - "8000"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  llm:
    build: ./services/llm
    image: llm-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      unstructured-api:
        condition: service_started
      qdrant:
        condition: service_started
    expose:
      - "8000"
    env_file:
      - ./services/llm/.env
    volumes:
      - ./services/llm:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  chat:
    build: ./services/chat
    image: chat-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
    expose:
      - "8000"
    env_file:
      - ./services/chat/.env
    volumes:
      - ./services/chat:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      chat:
        condition: service_started
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro

volumes:
  pg_data:
  searxng_data:
  qdrant_data:
