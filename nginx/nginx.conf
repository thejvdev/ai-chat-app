events {}

http {
  sendfile on;
  client_max_body_size 20m;

  upstream auth_api {
    server auth:8000;
    keepalive 32;
  }

  upstream chat_api {
    server chat:8000;
    keepalive 32;
  }

  server {
    listen 80;

    location = /api/health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # --- Auth ---
    location /api/auth/ {
      proxy_pass http://auth_api/auth/;
      include snippets/proxy_headers.conf;
    }

    # --- Chats ---
    location ~ ^/api/chats/[^/]+/stream$ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://chat_api;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      include snippets/proxy_headers.conf;

      proxy_buffering off;
      proxy_cache off;
      gzip off;

      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      send_timeout 1h;
    }
    
    location /api/chats/ {
      proxy_pass http://chat_api/chats/;
      include snippets/proxy_headers.conf;
    }
  }
}
